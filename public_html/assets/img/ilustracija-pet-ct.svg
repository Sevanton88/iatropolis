<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 -10 640 440" role="img" aria-labelledby="t">
  <title id="t">Ilustracija: PET-CT aparat sa stolom za pacijenta i prikazom snimka sa označenim nalazom</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#E4EEF9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8F5"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EDF8"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE1F5"/>
      <stop offset="1" stop-color="#EAF2FB"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0679E8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0679E8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0679E8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0679E8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0679E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0679E8" fill-opacity=".14"/>
    </pattern>
    <!-- sto je vidljiv levo od aparata i unutar otvora -->
    <clipPath id="couchClip">
      <rect x="0" y="0" width="440" height="400"/>
      <circle cx="560" cy="212" r="72"/>
    </clipPath>
  </defs>

  <!-- prostor -->
  <rect y="-80" width="800" height="600" fill="url(#bg)"/>
  <rect x="560" y="70" width="170" height="40" fill="url(#dots)"/>
  <rect y="330" width="800" height="190" fill="url(#floor)"/>
  <path d="M0 330H800" stroke="#B9CDE3" stroke-width="2"/>

  <g stroke="#0B3A6E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- aparat: zadnji (PET) i prednji (CT) deo -->
    <rect x="462" y="98" width="252" height="232" rx="44" fill="#E3EDF8"/>
    <rect x="436" y="88" width="250" height="242" rx="44" fill="url(#shade)"/>
    <rect x="446" y="318" width="230" height="12" rx="4" fill="#FFFFFF"/>
    <rect x="636" y="104" width="34" height="22" rx="5" fill="#DCE9F7"/>
    <path d="M643 115h20" stroke="#0679E8" stroke-width="2.5"/>

    <!-- otvor sa prstenom detektora -->
    <circle cx="561" cy="212" r="90" fill="#FFFFFF"/>
    <circle cx="561" cy="212" r="84" fill="none" stroke="#0679E8" stroke-opacity=".45" stroke-width="8" stroke-dasharray="14 8" stroke-linecap="butt"/>
    <circle cx="561" cy="212" r="72" fill="url(#bore)"/>
  </g>

  <!-- ravan skeniranja -->
  <rect x="557" y="140" width="8" height="144" fill="url(#scan)"/>

  <g stroke="#0B3A6E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- sto za pacijenta -->
    <path d="M232 330 244 248h48l12 82Z" fill="url(#shade)"/>
    <rect x="214" y="318" width="108" height="12" rx="4" fill="#FFFFFF"/>
    <g clip-path="url(#couchClip)">
      <rect x="150" y="228" width="460" height="16" rx="8" fill="#FFFFFF"/>
      <rect x="164" y="220" width="300" height="10" rx="5" fill="#DCE9F7"/>
    </g>

    <!-- prikaz snimka -->
    <rect x="148" y="84" width="160" height="104" rx="14" fill="#FFFFFF"/>
    <ellipse cx="208" cy="136" rx="40" ry="30" fill="#EEF4FB"/>
    <ellipse cx="208" cy="136" rx="22" ry="16" fill="none" stroke="#B9CDE3" stroke-width="2"/>
    <path d="M262 112h30M262 126h22M262 140h28" stroke="#B9CDE3" stroke-width="2.5"/>
    <path d="M262 160h18" stroke="#0679E8" stroke-width="3"/>
  </g>
  <circle cx="221" cy="128" r="16" fill="url(#glow)"/>
  <circle cx="221" cy="128" r="5.5" fill="#0679E8"/>
  <circle cx="221" cy="128" r="10" fill="none" stroke="#0679E8" stroke-width="2"/>
  <path d="M308 150C360 150 380 196 470 206" fill="none" stroke="#0679E8" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" stroke-opacity=".6"/>
</svg>
