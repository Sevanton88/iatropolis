<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 -10 640 440" role="img" aria-labelledby="t">
  <title id="t">Ilustracija: CyberKnife robotska ruka usmerava precizan snop zračenja ka ciljnoj tački iznad stola za pacijenta</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#E4EEF9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8F5"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0679E8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0679E8" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0679E8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0679E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0679E8" fill-opacity=".14"/>
    </pattern>
  </defs>

  <!-- prostor -->
  <rect y="-80" width="800" height="600" fill="url(#bg)"/>
  <rect x="24" y="24" width="190" height="120" fill="url(#dots)"/>
  <rect y="330" width="800" height="190" fill="url(#floor)"/>
  <path d="M0 330H800" stroke="#B9CDE3" stroke-width="2"/>

  <!-- prstenovi preciznosti oko cilja -->
  <g fill="none" stroke="#0679E8" stroke-linecap="round">
    <circle cx="520" cy="236" r="150" stroke-opacity=".08" stroke-width="2"/>
    <circle cx="520" cy="236" r="104" stroke-opacity=".12" stroke-width="2" stroke-dasharray="2 10"/>
    <circle cx="520" cy="236" r="62" stroke-opacity=".18" stroke-width="2"/>
  </g>
  <circle cx="520" cy="236" r="60" fill="url(#glow)"/>

  <g stroke="#0B3A6E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- sto za pacijenta -->
    <rect x="520" y="306" width="96" height="24" rx="7" fill="url(#shade)"/>
    <rect x="555" y="262" width="26" height="46" rx="4" fill="#FFFFFF"/>
    <path d="M568 276v18" stroke="#0679E8" stroke-width="2"/>
    <rect x="320" y="248" width="400" height="18" rx="9" fill="#FFFFFF"/>
    <rect x="334" y="238" width="58" height="12" rx="6" fill="#DCE9F7"/>

    <!-- robot: postolje i telo -->
    <rect x="122" y="314" width="136" height="16" rx="5" fill="#FFFFFF"/>
    <path d="M146 314 158 268h64l12 46Z" fill="url(#shade)"/>
    <path d="M152 300h76" stroke="#0679E8" stroke-width="3"/>
    <circle cx="190" cy="262" r="26" fill="#FFFFFF"/>
    <circle cx="190" cy="262" r="9" fill="#DCE9F7"/>

    <!-- donji segment ruke -->
    <g transform="translate(190 262) rotate(-63.8)">
      <rect x="-16" y="-23" width="152" height="46" rx="23" fill="url(#shade)"/>
      <path d="M22 0h76" stroke="#B9CDE3" stroke-width="2"/>
    </g>
    <circle cx="250" cy="140" r="24" fill="#FFFFFF"/>
    <circle cx="250" cy="140" r="8" fill="#DCE9F7"/>

    <!-- gornji segment ruke -->
    <g transform="translate(250 140) rotate(-11.3)">
      <rect x="-8" y="-17" width="124" height="34" rx="17" fill="url(#shade)"/>
    </g>
    <circle cx="360" cy="118" r="17" fill="#FFFFFF"/>

    <!-- linearni akcelerator (glava) i snop -->
    <g transform="translate(360 118) rotate(36.4)">
      <polygon points="134,-9 134,9 199,0" fill="url(#beam)" stroke="none"/>
      <rect x="2" y="-36" width="112" height="72" rx="20" fill="#FFFFFF"/>
      <path d="M24 -10h64" stroke="#0679E8" stroke-width="3"/>
      <path d="M24 4h40" stroke="#B9CDE3" stroke-width="2"/>
      <rect x="112" y="-16" width="24" height="32" rx="5" fill="#0B3A6E"/>
    </g>
  </g>

  <!-- ciljna tačka -->
  <g stroke="#0679E8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="520" cy="236" r="12" fill="#FFFFFF"/>
    <circle cx="520" cy="236" r="4" fill="#0679E8" stroke="none"/>
    <path d="M520 214v-8M520 258v8M498 236h-8M542 236h8"/>
  </g>
</svg>
