<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 -10 640 440" role="img" aria-labelledby="t">
  <title id="t">Ilustracija: TomoTherapy aparat sa prstenastim kućištem koje rotira oko stola i spiralno usmerava zračenje ka cilju</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#E4EEF9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8F5"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EDF8"/>
    </linearGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE1F5"/>
      <stop offset="1" stop-color="#EAF2FB"/>
    </linearGradient>
    <linearGradient id="helix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0679E8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0679E8" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0679E8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#0679E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0679E8" fill-opacity=".14"/>
    </pattern>
    <clipPath id="couchClip">
      <rect x="0" y="0" width="430" height="400"/>
      <circle cx="560" cy="206" r="80"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9Z" fill="#0679E8"/>
    </marker>
  </defs>

  <!-- prostor -->
  <rect y="-80" width="800" height="600" fill="url(#bg)"/>
  <rect x="120" y="76" width="170" height="80" fill="url(#dots)"/>
  <rect y="330" width="800" height="190" fill="url(#floor)"/>
  <path d="M0 330H800" stroke="#B9CDE3" stroke-width="2"/>


  <g stroke="#0B3A6E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- prstenasto kućište -->
    <rect x="448" y="98" width="264" height="232" rx="92" fill="#E3EDF8"/>
    <rect x="428" y="88" width="264" height="242" rx="92" fill="url(#shade)"/>
    <rect x="440" y="318" width="240" height="12" rx="4" fill="#FFFFFF"/>
    <circle cx="560" cy="206" r="96" fill="#FFFFFF"/>
    <circle cx="560" cy="206" r="80" fill="url(#bore)"/>
    <circle cx="560" cy="206" r="88" fill="none" stroke="#DCE9F7" stroke-width="2"/>
  </g>

  <!-- rotacija kućišta oko pacijenta -->
  <path d="M477.3 175.9A88 88 0 0 1 642.7 175.9" fill="none" stroke="#0679E8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- cilj unutar otvora -->
  <circle cx="560" cy="206" r="54" fill="url(#glow)"/>
  <g stroke="#0679E8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="560" cy="206" r="30" stroke-opacity=".35" stroke-dasharray="2 7"/>
    <circle cx="560" cy="206" r="10" fill="#FFFFFF"/>
    <circle cx="560" cy="206" r="3.5" fill="#0679E8" stroke="none"/>
  </g>

  <g stroke="#0B3A6E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- sto za pacijenta -->
    <path d="M222 330 234 252h48l12 78Z" fill="url(#shade)"/>
    <rect x="204" y="318" width="108" height="12" rx="4" fill="#FFFFFF"/>
    <g clip-path="url(#couchClip)">
      <rect x="140" y="236" width="480" height="16" rx="8" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- spiralna (helikalna) putanja zračenja -->
  <path d="M258 244q14-46 28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="#0679E8" stroke-opacity=".12" stroke-width="10" stroke-linecap="round"/>
  <path d="M258 244q14-46 28 0t28 0t28 0t28 0t28 0t28 0" fill="none" stroke="url(#helix)" stroke-width="3" stroke-linecap="round"/>
</svg>
